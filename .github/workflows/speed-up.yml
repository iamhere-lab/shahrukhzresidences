name: Speed up lead submit (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/speed-up.yml']
permissions:
  contents: write
jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import pathlib
          js = pathlib.Path("assets/js/main.js"); s = js.read_text(encoding="utf-8")
          a = "    fetch(CFG.leadEndpoint, req).then(function (res) {"
          if "sendBeacon" not in s:
              assert s.count(a) == 1, "fetch line not found"
              b = ('    var beaconSent = false;\n'
                   '    if (mode === "form" && navigator.sendBeacon) {\n'
                   '      try { beaconSent = navigator.sendBeacon(CFG.leadEndpoint, new Blob([req.body], { type: "application/x-www-form-urlencoded;charset=UTF-8" })); } catch (e) {}\n'
                   '    }\n'
                   '    req.keepalive = true;\n'
                   '    (beaconSent ? Promise.resolve({ type: "opaque", ok: true }) : fetch(CFG.leadEndpoint, req)).then(function (res) {')
              js.write_text(s.replace(a, b, 1), encoding="utf-8"); print("main.js patched")
          h = pathlib.Path("index.html"); t = h.read_text(encoding="utf-8"); k = '<link rel="stylesheet" href="assets/css/styles.css">'
          if 'rel="prefetch"' not in t:
              assert k in t; h.write_text(t.replace(k, k + '\n<link rel="prefetch" href="thank-you.html">', 1), encoding="utf-8"); print("prefetch added")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/speed-up.yml
          git add -A
          git commit -m "Open thank-you page immediately after submit (sendBeacon) and prefetch it"
          git push
